name: Start Codespace

on:
  workflow_dispatch:

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Restart and Connect Tailscale
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
        run: |
          CS_NAME=$(gh api /user/codespaces --jq '.codespaces[] | select(.repository.full_name=="mkrangrej08-web/THE-LINUX") | .name')
          echo "Target Codespace: $CS_NAME"

          # 1. Codespace को रिफ्रेश करने के लिए स्टॉप और स्टार्ट करें
          gh api --method POST /user/codespaces/$CS_NAME/stop || true
          sleep 5
          gh api --method POST /user/codespaces/$CS_NAME/start
          
          echo "Waiting 20 seconds for container initialization..."
          sleep 20

          # 2. Tailscale और VNC को जबरन कमांड भेजकर स्टार्ट करें
          gh codespace ssh -c "$CS_NAME" -- "sudo tailscaled --tun=userspace-networking --socks5-server=localhost:1055 & sleep 3 && sudo tailscale up --authkey=tskey-auth-kp4D8uZ79V11CNTRL-cwVtEnFQAEcnJsRVMK4YDcDrrygXERVa --hostname=codespace-desktop && bash /workspaces/THE-LINUX/start-desktop-vnc.sh &" || true
          
          echo "Services started successfully!"
